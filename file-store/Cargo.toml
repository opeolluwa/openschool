[package]
name = "openschool_file_storage"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
    "http2",
] }
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["fs"] }
url = "2.5"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.44.2", features = ["fs", "macros", "net", "rt-multi-thread"] }
