[package]
name = "openschool_mailman"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.1"
askama = "0.15.6"
base64 = "0.22"
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "pool", "builder", "hostname", "tokio1-rustls", "ring", "rustls", "rustls-native-certs"] }
openschool_eventbus = { path = "../eventbus" }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "http2"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
mockall = "0.13"
tokio = { version = "1.44.2", features = ["full", "macros"] }
